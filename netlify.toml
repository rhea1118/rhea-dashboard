[build]
  publish = "."
  command = ""

# 只在 data/daily-brief.json 变更时才构建（其他文件变更跳过，节省额度）
[build.ignore]
  # 如果提交里没有 daily-brief.json 的变更，就跳过构建
  # 这条规则只在 Actions 推到 main 时生效，其他正常代码 push 仍会构建
  # 注意：Netlify 的 ignore 只对部分文件路径生效，不能用 shell 命令
  # 所以严格依赖 Actions 只在文件变更时才 push

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "no-cache"
